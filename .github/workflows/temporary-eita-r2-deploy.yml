name: "🧪 Temporary · Deploy Eita artifact routes"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-eita-temporary-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "🐚 Build, deploy and probe Eita routes"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "549830258550a5d0ada2e37040751904"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN. Add it as a repository Actions secret in rodkisten/shell."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 bucket info eita-previews
      - name: Deploy Worker with R2 binding
        run: npx wrangler deploy
      - name: Verify deployed R2 binding
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shell/settings")"
          printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.bindings?.some(b=>b.name==="EITA_PREVIEWS"&&b.type==="r2_bucket")){console.error("Missing EITA_PREVIEWS binding");process.exit(1)}console.log("EITA_PREVIEWS binding active")})'
      - name: Verify artifact route does not fall back to SPA
        shell: bash
        run: |
          set -euo pipefail
          url="https://shell.migos.club/install/eita/pr/999999999/manifest.json"
          code="$(curl --retry 5 --retry-delay 3 --retry-connrefused -sS -o /tmp/eita-route-response -w '%{http_code}' "$url")"
          echo "Response: $code"
          cat /tmp/eita-route-response
          test "$code" = 404
          if grep -qi '<!doctype html' /tmp/eita-route-response; then
            echo "::error::SPA HTML returned for artifact route"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          echo "## 🦀 Eita artifact route deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: https://shell.migos.club/install/eita/pr/1/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is temporary. Remove after validation." >> "$GITHUB_STEP_SUMMARY"
