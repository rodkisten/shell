name: 🧬 Filtered ShellConductor CI
run-name: ShellConductor CI · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: shell-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: 🧬 Shared affected-area CI
    uses: rodkisten/github/.github/workflows/filtered-ci.yml@feat/typescript-reusable-workflows
    permissions:
      contents: read
      pull-requests: read
    with:
      repository-key: shell
      node-version: '22'
      working-directory: .
      test-command: npm test
      build-command: npm run build
      lint-command: npm run lint
      run-tests: false
      run-build: true
      run-lint: true
