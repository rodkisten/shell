name: Filtered ShellConductor CI
run-name: ShellConductor CI · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: shell-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shared affected-area CI
    permissions:
      contents: read
      pull-requests: read
    uses: rodkisten/github/.github/workflows/filtered-ci.yml@main
    with:
      repository-key: shell
      config-ref: main
      node-version: '24'
      working-directory: .
      test-command: npm run test:explorer
      build-command: npm run build
      lint-command: npm run lint
      run-tests: true
      run-build: true
      run-lint: true

  format:
    name: 🎨 Universal format · changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Install local formatting tools
        run: npm ci --no-audit --no-fund
      - name: 🐚 Install ShellCheck, shfmt and Zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt zsh
      - name: 🧩 Checkout Rod Actions
        uses: actions/checkout@v4
        with:
          repository: rodkisten/github
          ref: main
          path: .rod-actions
          persist-credentials: false
      - name: 📦 Build shared TypeScript Actions
        working-directory: .rod-actions
        run: npm ci --no-audit --no-fund && npm run build
      - name: 🎨 Validate modified files
        uses: ./.rod-actions/actions/format
        with:
          mode: check
          scope: changed
          base: origin/main
          lint: 'true'
