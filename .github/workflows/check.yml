name: Filtered ShellConductor CI
run-name: ShellConductor CI · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: shell-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shared affected-area CI
    permissions:
      contents: read
      pull-requests: read
    uses: rodkisten/github/.github/workflows/filtered-ci.yml@main
    with:
      repository-key: shell
      config-ref: main
      node-version: '24'
      working-directory: .
      test-command: npm run test:explorer && npm run test:installer
      build-command: npm run build
      lint-command: npm run lint
      run-tests: true
      run-build: true
      run-lint: true
