name: 🔒 Sync npm lockfile
run-name: "🔒 Lockfile · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    paths:
      - package.json
      - sync-lockfile.yaml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-lockfile-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    environment:
      name: production
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: 🤖 Rod GitHub App token
       # if: steps.changed.outputs.changed == 'true'
        id: bot
        uses: rodkisten/github/actions/app-token@main
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: 🟩 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: 🧪 Verify manifest consistency
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('Missing lockfile root');
          for (const kind of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, range] of Object.entries(pkg[kind] ?? {})) {
              if (root[kind]?.[name] !== range) throw new Error(`Lockfile mismatch: ${name}`);
            }
          }
          NODE
      - name: 🔎 Check lockfile changes
        id: changed
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: 📝 Commit lockfile through GitHub API
        if: steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const branch = process.env.TARGET_BRANCH;
            const path = 'package-lock.json';
            let sha;
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(response.data)) throw new Error('Expected a lockfile, got a directory');
              sha = response.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path, sha,
              content: fs.readFileSync(path).toString('base64'),
              message: 'chore(lockfile): sync package-lock.json [skip ci]',
            });
            await core.summary.addRaw(`Updated \`${path}\` on \`${branch}\` using Rod GitHub App.\n`).write();
      - name: 💤 No changes
        if: steps.changed.outputs.changed == 'false'
        run: echo 'Lockfile already matches package.json.' >> "$GITHUB_STEP_SUMMARY"
