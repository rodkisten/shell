name: 🔒 Sync npm lockfile
run-name: "🔒 Lockfile · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    paths:
      - package.json
      - sync-lockfile.yaml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-lockfile-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    environment:
      name: production
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: 🟩 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 📦 Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: 🧪 Verify manifest consistency
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('Missing lockfile root');
          for (const kind of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, range] of Object.entries(pkg[kind] ?? {})) {
              if (root[kind]?.[name] !== range) throw new Error(`Lockfile mismatch: ${name}`);
            }
          }
          NODE
      - name: 🔎 Check lockfile changes
        id: changed
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare atomic commit payload
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          const paths = ['package-lock.json'];
          if (paths.some(p => !existsSync(p))) throw new Error('Unexpected deleted module file; review manually');
          writeFileSync(join(process.env.RUNNER_TEMP, 'sync-changes.json'), JSON.stringify(paths.map(path => ({ path, content: readFileSync(path).toString('base64'), encoding: 'base64' }))));
          NODE
      - name: Commit synchronized files
        if: steps.changed.outputs.changed == 'true'
        uses: rodkisten/github/src/commit@main
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          message: 'chore(lockfile): sync package-lock.json [skip ci]'
          files-path: ${{ runner.temp }}/sync-changes.json
      - name: 📋 Explain PR branch policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork PRs are read-only; no bot credentials are exposed.' >> "$GITHUB_STEP_SUMMARY"
      - name: 💤 No changes
        if: steps.changed.outputs.changed == 'false'
        run: echo 'Lockfile already matches package.json.' >> "$GITHUB_STEP_SUMMARY"
