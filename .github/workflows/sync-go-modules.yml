name: 🐹 Sync Go modules
run-name: "🐹 Go modules · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    paths:
      - 'tools/**/go.mod'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/**/go.mod'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-modules-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/shell-flow/go.mod
          cache: false
      - name: Regenerate Go module files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' module; do
            directory="$(dirname "$module")"
            echo "🐹 Synchronizing $directory"
            (cd "$directory" && go mod tidy && go mod verify)
          done < <(find tools -name go.mod -type f -print0)
      - name: Detect module changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- ':(glob)tools/**/go.mod' ':(glob)tools/**/go.sum' &&
             test -z "$(git ls-files --others --exclude-standard -- ':(glob)tools/**/go.sum')"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare atomic commit payload
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          const paths = [...new Set([...execFileSync('git', ['diff', '--name-only', '-z', 'HEAD', '--', 'tools']).toString().split('\0'), ...execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z', '--', 'tools']).toString().split('\0')])].filter(p => /\/go\.(mod|sum)$/.test(p));
          if (paths.some(p => !existsSync(p))) throw new Error('Unexpected deleted module file; review manually');
          writeFileSync(join(process.env.RUNNER_TEMP, 'sync-changes.json'), JSON.stringify(paths.map(path => ({ path, content: readFileSync(path).toString('base64'), encoding: 'base64' }))));
          NODE
      - name: Commit synchronized files
        if: steps.changed.outputs.changed == 'true'
        uses: rodkisten/github/src/commit@main
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          message: 'chore(go): sync module checksums [skip ci]'
          files-path: ${{ runner.temp }}/sync-changes.json
      - name: Already synchronized
        if: steps.changed.outputs.changed == 'false'
        run: echo 'Go modules already synchronized.' >> "$GITHUB_STEP_SUMMARY"
