name: 🐹 Sync Go modules
run-name: "🐹 Go modules · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    paths:
      - 'tools/**/go.mod'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/**/go.mod'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-modules-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/shell-flow/go.mod
          cache: false
      - name: Regenerate Go module files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' module; do
            directory="$(dirname "$module")"
            echo "🐹 Synchronizing $directory"
            (cd "$directory" && go mod tidy && go mod verify)
          done < <(find tools -name go.mod -type f -print0)
      - name: Detect module changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- ':(glob)tools/**/go.mod' ':(glob)tools/**/go.sum' &&
             test -z "$(git ls-files --others --exclude-standard -- ':(glob)tools/**/go.sum')"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Rod GitHub App
        if: steps.changed.outputs.changed == 'true'
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit updated module files
        if: steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const branch = process.env.TARGET_BRANCH;
            const files = execFileSync('git', ['ls-files', '--cached', '--others', '--exclude-standard', 'tools'], {encoding:'utf8'})
              .split('\n').filter(path => /\/go\.(mod|sum)$/.test(path));
            for (const path of files) {
              if (!fs.existsSync(path)) continue;
              const content = fs.readFileSync(path).toString('base64');
              let sha;
              try {
                const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
                if (Array.isArray(current.data)) throw new Error('Expected a file');
                sha = current.data.sha;
                if (Buffer.from(current.data.content || '', 'base64').equals(fs.readFileSync(path))) continue;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha, content,
                message: 'chore(go): sync module checksums [skip ci]',
              });
              core.info(`Updated ${path}`);
            }
            await core.summary.addRaw('Go module manifests and checksums synchronized.\n').write();
      - name: Already synchronized
        if: steps.changed.outputs.changed == 'false'
        run: echo 'Go modules already synchronized.' >> "$GITHUB_STEP_SUMMARY"
