name: 🐚 SH · Cloudflare PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: shell-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/shell-flow-wasm.yml
    permissions:
      contents: read
      actions: read

  preview:
    concurrency:
      group: shell-preview-stable-redirect
      cancel-in-progress: false
    needs: build
    environment: production
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rodkisten/github/src/setup-node@main
        with:
          node-version: '24'
      - name: Download validated preview build
        uses: actions/download-artifact@v4
        with:
          name: shell-flow-preview-dist
          path: .
      - name: Verify restored deploy configuration
        run: |
          test -s dist/client/wasm/shell-flow.wasm
          test -s .wrangler/deploy/config.json
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi
      - name: Enable workers.dev preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"enabled":false,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shell/subdomain" \
            --output "$response"
          jq -e '.success == true and .result.enabled == false and .result.previews_enabled == true' "$response" >/dev/null

      - id: deploy
        name: Create or update Cloudflare Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Capture diagnostics separately: Wrangler's JSON output must remain
          # parseable, but errors must never disappear inside $(...).
          stdout="$(mktemp)"
          stderr="$(mktemp)"
          trap 'rm -f "$stdout" "$stderr"' EXIT
          if ! npx --yes wrangler@^4.135.0 preview --name "pr-$PR_NUMBER" --json >"$stdout" 2>"$stderr"; then
            echo "::error::Cloudflare Worker Preview deployment failed"
            sed -E 's/(Bearer |token[=: ]+)[^ ]+/\1[REDACTED]/Ig' "$stderr" >&2
            # Wrangler can emit API errors on stdout even when stderr is empty.
            # Print structured errors only, never arbitrary raw output.
            if jq -e . "$stdout" >/dev/null 2>&1; then
              jq '{success, errors, messages}' "$stdout" >&2
            else
              echo "::warning::Wrangler stdout was not JSON; inspect Wrangler debug logs in the runner." >&2
              sed -E 's/(Bearer |token[=: ]+)[^ ]+/\1[REDACTED]/Ig' "$stdout" | tail -n 50 >&2
            fi
            echo "### Preview deployment failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect the deploy step logs for Wrangler diagnostics." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$stderr" >&2
          # Vite/Cloudflare may print a redirected-configuration preamble
          # before the JSON object, even with --json.
          preview_url="$(node - "$stdout" <<'NODE'
          const fs = require('node:fs');
          const output = fs.readFileSync(process.argv[2], 'utf8');
          for (let start = output.indexOf('{'); start !== -1; start = output.indexOf('{', start + 1)) {
            try {
              const data = JSON.parse(output.slice(start));
              const url = data.preview?.urls?.[0] ?? data.urls?.[0];
              if (typeof url === 'string' && /^https:\/\//.test(url)) {
                process.stdout.write(url);
                process.exit(0);
              }
            } catch {}
          }
          process.exit(1);
          NODE
          )" || {
            echo "::error::Wrangler output did not contain a valid preview URL"
            echo "::group::Wrangler output (redacted)"
            sed -E 's/(Bearer |token[=: ]+)[^ ]+/\1[REDACTED]/Ig' "$stdout" | tail -n 70
            echo "::endgroup::"
            exit 1
          }
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test Wrangler preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 --output /dev/null "$PREVIEW_URL/"
          echo "Wrangler preview responded successfully: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - id: custom_preview
        name: Verify custom PR preview domain
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          custom_preview_url="https://pr-$PR_NUMBER.preview.shell.migos.club"
          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output /dev/null "$custom_preview_url/"
          echo "url=$custom_preview_url" >> "$GITHUB_OUTPUT"
          echo "Custom preview responded successfully: $custom_preview_url" >> "$GITHUB_STEP_SUMMARY"

      - id: native_preview
        name: Verify workers.dev PR preview URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail-with-body --show-error --silent \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/shell/previews/pr-$PR_NUMBER" \
            --output "$response"
          native_preview_url="$(jq -r '.result.urls[]? | select(endswith(".workers.dev"))' "$response" | head -n 1)"
          if [[ -z "$native_preview_url" || "$native_preview_url" == "null" ]]; then
            echo "::error::Cloudflare preview did not expose a workers.dev URL"
            cat "$response" | jq '{success, errors, messages, result: {slug: .result.slug, urls: .result.urls}}' >&2
            exit 1
          fi
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 3 \
            --output /dev/null "$native_preview_url/"
          echo "url=$native_preview_url" >> "$GITHUB_OUTPUT"
          echo "Native preview responded successfully: $native_preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Point shell.preview.migos.club at this successful preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_PREVIEW_URL: ${{ steps.custom_preview.outputs.url }}
          NATIVE_PREVIEW_URL: ${{ steps.native_preview.outputs.url }}
        run: |
          set -euo pipefail
          worker="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$worker" "$response"' EXIT

          node >"$worker" <<'NODE'
          const custom = process.env.CUSTOM_PREVIEW_URL;
          const native = process.env.NATIVE_PREVIEW_URL;
          if (!/^https:\/\/pr-\d+\.preview\.shell\.migos\.club$/.test(custom)) {
            throw new Error('Refusing unexpected custom preview URL: ' + custom);
          }
          if (!/^https:\/\/pr-\d+-shell\.[a-z0-9-]+\.workers\.dev$/.test(native)) {
            throw new Error('Refusing unexpected workers.dev preview URL: ' + native);
          }
          process.stdout.write(`addEventListener("fetch", event => {
            const incoming = new URL(event.request.url);
            const target = new URL(${JSON.stringify(native)});
            target.pathname = incoming.pathname;
            target.search = incoming.search;
            event.respondWith(new Response(null, {
              status: 302,
              headers: {
                "Location": target.toString(),
                "Cache-Control": "no-store",
                "X-Robots-Tag": "noindex",
                "X-Shell-Preview-Target": ${JSON.stringify(custom)}
              }
            }));
          });`);
          NODE

          curl --fail-with-body --show-error --silent \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/javascript" \
            --data-binary "@$worker" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shell-preview-latest" \
            --output "$response"

          jq -e '.success == true' "$response" >/dev/null

          headers="$(mktemp)"
          trap 'rm -f "$worker" "$response" "$headers"' EXIT
          matched=false
          for attempt in $(seq 1 12); do
            : > "$headers"
            curl --show-error --silent --max-time 15 --dump-header "$headers" --output /dev/null "https://shell.preview.migos.club/?verify=$GITHUB_RUN_ID-$attempt" || true
            actual_target="$(grep -im1 '^x-shell-preview-target:' "$headers" | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true)"
            actual_location="$(grep -im1 '^location:' "$headers" | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true)"
            expected_location="$NATIVE_PREVIEW_URL/?verify=$GITHUB_RUN_ID-$attempt"
            if [[ "$actual_target" == "$CUSTOM_PREVIEW_URL" && "$actual_location" == "$expected_location" ]]; then
              matched=true
              break
            fi
            echo "::notice::Preview redirect pending ($attempt/12): target=$actual_target location=$actual_location"
            sleep 3
          done
          if [[ "$matched" != true ]]; then
            echo "::error::Stable preview redirect mismatch after retries. Expected $CUSTOM_PREVIEW_URL -> $NATIVE_PREVIEW_URL, got $actual_target -> $actual_location"
            exit 1
          fi
          curl --location --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 3 \
            --output /dev/null "https://shell.preview.migos.club/"
          echo "Latest successful preview: $CUSTOM_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Native fallback: $NATIVE_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable preview: https://shell.preview.migos.club" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout shared reporting utilities
        uses: actions/checkout@v4
        with:
          repository: rodkisten/github
          ref: main
          path: .rod-report-tools
          persist-credentials: false

      - name: Measure verified build artifacts
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.wasm' -o -name '*.mjs' \) -print0 | sort -z > "$RUNNER_TEMP/shell-bundle-files"
          mapfile -d '' bundles < "$RUNNER_TEMP/shell-bundle-files"
          node .rod-report-tools/scripts/measure-bundles.mjs "$RUNNER_TEMP/shell-bundles.json" "${bundles[@]}"
          node .rod-report-tools/scripts/render-banner.mjs shell 'Preview ready' "$RUNNER_TEMP/shell-banner.svg"

      - name: Preserve bundle snapshot and banner
        uses: actions/upload-artifact@v4
        with:
          name: shell-preview-report
          path: |
            ${{ runner.temp }}/shell-bundles.json
            ${{ runner.temp }}/shell-banner.svg
          retention-days: 30
          overwrite: true

      - name: Prepare verified preview metadata
        env:
          PREVIEW_URL: ${{ steps.custom_preview.outputs.url }}
          NATIVE_URL: ${{ steps.native_preview.outputs.url }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --arg url "$PREVIEW_URL" --arg native "$NATIVE_URL" --arg sha "$DEPLOYED_SHA" '{
            title: "🐚 Shell Workbench · Live PR Preview",
            banner: "https://raw.githubusercontent.com/rodkisten/github/main/assets/banners/shell/preview-ready.svg",
            url: $url, sha: $sha, status: "success",
            description: "Both preview endpoints and the stable redirect were verified.",
            links: [{label:"Workflow Studio",url:($url+"/workflow/")},{label:"Native preview",url:$native},{label:"Latest successful preview",url:"https://shell.preview.migos.club/"}]
          }' > "$RUNNER_TEMP/shell-preview-report.json"

      - name: Publish shared preview dashboard
        id: report
        uses: rodkisten/github/src/preview-report@main
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          results-file: ${{ runner.temp }}/shell-preview-report.json
          bundle-file: ${{ runner.temp }}/shell-bundles.json
          baseline-file: .github/baselines/shell-bundles.json
          history-artifact: shell-preview-report

      - name: Remove superseded legacy dashboard
        if: steps.report.outputs.comment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- shell-pr-preview-dashboard:v1 -->"))) | .id' |
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
            done

  cleanup:
    concurrency:
      group: shell-preview-stable-redirect
      cancel-in-progress: false
    environment: production
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: redirect_guard
        name: Keep latest-preview redirect valid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          closing_url="https://pr-$PR_NUMBER.preview.shell.migos.club"
          current="$(
            curl --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 \
              --dump-header - --output /dev/null "https://shell.preview.migos.club/" |
              awk 'BEGIN{IGNORECASE=1} /^x-shell-preview-target:/ {$1=""; sub(/^ /,""); sub(/\r$/,""); print; exit}'
          )"

          if [[ "$current" != "$closing_url" ]]; then
            echo "safe_to_delete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fallback=""
          while read -r number; do
            [[ -z "$number" || "$number" == "$PR_NUMBER" ]] && continue
            candidate="https://pr-$number.preview.shell.migos.club"
            if curl --fail --show-error --silent --max-time 15 --output /dev/null "$candidate/"; then
              fallback="$candidate"
              break
            fi
          done < <(gh pr list --state open --limit 30 --json number,updatedAt --jq 'sort_by(.updatedAt) | reverse | .[].number')

          if [[ -z "$fallback" ]]; then
            echo "::warning::No healthy open PR preview found. Keeping pr-$PR_NUMBER alive so shell.preview.migos.club does not break."
            echo "safe_to_delete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          native_response="$(mktemp)"
          worker="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$native_response" "$worker" "$response"' EXIT
          fallback_number="${fallback#https://pr-}"
          fallback_number="${fallback_number%%.*}"
          curl --fail-with-body --show-error --silent \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/shell/previews/pr-$fallback_number" \
            --output "$native_response"
          native_fallback="$(jq -r '.result.urls[]? | select(endswith(".workers.dev"))' "$native_response" | head -n 1)"
          if [[ -z "$native_fallback" || "$native_fallback" == "null" ]]; then
            echo "::warning::Fallback preview has no workers.dev URL. Keeping closing preview alive."
            echo "safe_to_delete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CUSTOM_PREVIEW_URL="$fallback" NATIVE_PREVIEW_URL="$native_fallback" node >"$worker" <<'NODE'
          const custom = process.env.CUSTOM_PREVIEW_URL;
          const native = process.env.NATIVE_PREVIEW_URL;
          process.stdout.write(`addEventListener("fetch", event => {
            const incoming = new URL(event.request.url);
            const target = new URL(${JSON.stringify(native)});
            target.pathname = incoming.pathname;
            target.search = incoming.search;
            event.respondWith(new Response(null, {
              status: 302,
              headers: {
                "Location": target.toString(),
                "Cache-Control": "no-store",
                "X-Robots-Tag": "noindex",
                "X-Shell-Preview-Target": ${JSON.stringify(custom)}
              }
            }));
          });`);
          NODE
          curl --fail-with-body --show-error --silent \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/javascript" \
            --data-binary "@$worker" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shell-preview-latest" \
            --output "$response"
          jq -e '.success == true' "$response" >/dev/null
          echo "safe_to_delete=true" >> "$GITHUB_OUTPUT"
          echo "Latest-preview redirect moved to $fallback" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete closed PR preview
        if: steps.redirect_guard.outputs.safe_to_delete == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --yes wrangler@^4.135.0 preview delete --name "pr-$PR_NUMBER" --skip-confirmation
