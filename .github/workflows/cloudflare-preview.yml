name: Cloudflare PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: shell-preview-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    environment: production
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build preview assets
        run: npm run build
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi
      - id: deploy
        name: Create or update Cloudflare Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Capture diagnostics separately: Wrangler's JSON output must remain
          # parseable, but errors must never disappear inside $(...).
          stdout="$(mktemp)"
          stderr="$(mktemp)"
          trap 'rm -f "$stdout" "$stderr"' EXIT
          if ! npx --yes wrangler@^4.135.0 preview --name "pr-$PR_NUMBER" --json >"$stdout" 2>"$stderr"; then
            echo "::error::Cloudflare Worker Preview deployment failed"
            sed -E 's/(Bearer |token[=: ]+)[^ ]+/\1[REDACTED]/Ig' "$stderr" >&2
            # Wrangler can emit API errors on stdout even when stderr is empty.
            # Print structured errors only, never arbitrary raw output.
            if jq -e . "$stdout" >/dev/null 2>&1; then
              jq '{success, errors, messages}' "$stdout" >&2
            else
              echo "::warning::Wrangler stdout was not JSON; inspect Wrangler debug logs in the runner." >&2
              sed -E 's/(Bearer |token[=: ]+)[^ ]+/\1[REDACTED]/Ig' "$stdout" | tail -n 50 >&2
            fi
            echo "### Preview deployment failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect the deploy step logs for Wrangler diagnostics." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$stderr" >&2
          # Vite/Cloudflare may print a redirected-configuration preamble
          # before the JSON object, even with --json.
          preview_url="$(node - "$stdout" <<'NODE'
          const fs = require('node:fs');
          const output = fs.readFileSync(process.argv[2], 'utf8');
          for (let start = output.indexOf('{'); start !== -1; start = output.indexOf('{', start + 1)) {
            try {
              const data = JSON.parse(output.slice(start));
              const url = data.preview?.urls?.[0] ?? data.urls?.[0];
              if (typeof url === 'string' && /^https:\/\//.test(url)) {
                process.stdout.write(url);
                process.exit(0);
              }
            } catch {}
          }
          process.exit(1);
          NODE
          )" || {
            echo "::error::Wrangler output did not contain a valid preview URL"
            echo "::group::Wrangler output (redacted)"
            sed -E 's/(Bearer |token[=: ]+)[^ ]+/\1[REDACTED]/Ig' "$stdout" | tail -n 70
            echo "::endgroup::"
            exit 1
          }
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test Wrangler preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 --output /dev/null "$PREVIEW_URL/"
          echo "Wrangler preview responded successfully: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - id: custom_preview
        name: Verify custom PR preview domain
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          custom_preview_url="https://pr-$PR_NUMBER.preview.shell.migos.club"
          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output /dev/null "$custom_preview_url/"
          echo "url=$custom_preview_url" >> "$GITHUB_OUTPUT"
          echo "Custom preview responded successfully: $custom_preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Point shell.preview.migos.club at this successful preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_PREVIEW_URL: ${{ steps.custom_preview.outputs.url }}
        run: |
          set -euo pipefail
          worker="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$worker" "$response"' EXIT

          node >"$worker" <<'NODE'
          const target = process.env.CUSTOM_PREVIEW_URL;
          if (!/^https:\/\/pr-\d+\.preview\.shell\.migos\.club$/.test(target)) {
            throw new Error('Refusing to publish an unexpected preview redirect target: ' + target);
          }
          process.stdout.write(`addEventListener("fetch", event => {
            const incoming = new URL(event.request.url);
            const target = new URL(${JSON.stringify(target)});
            target.pathname = incoming.pathname;
            target.search = incoming.search;
            event.respondWith(new Response(null, {
              status: 302,
              headers: {
                "Location": target.toString(),
                "Cache-Control": "no-store",
                "X-Robots-Tag": "noindex"
              }
            }));
          });`);
          NODE

          curl --fail-with-body --show-error --silent \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/javascript" \
            --data-binary "@$worker" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shell-preview-latest" \
            --output "$response"

          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!data.success) {
            console.error(data.errors ?? data);
            process.exit(1);
          }
          NODE

          expected="$CUSTOM_PREVIEW_URL/"
          actual="$(
            curl --show-error --silent --retry 8 --retry-all-errors --retry-delay 3 \
              --dump-header - --output /dev/null "https://shell.preview.migos.club/" |
              awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /,""); sub(/\r$/,""); print; exit}'
          )"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Latest-preview redirect mismatch. Expected $expected, got $actual"
            exit 1
          fi
          echo "Latest successful preview: $CUSTOM_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable redirect: https://shell.preview.migos.club" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment stable preview URLs on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.custom_preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "☁️ **PR Preview:** $PREVIEW_URL

          🧭 **Latest successful preview:** https://shell.preview.migos.club

          The fixed URL is updated only after the PR preview passes both smoke tests."

  cleanup:
    environment: production
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: redirect_guard
        name: Keep latest-preview redirect valid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          closing_url="https://pr-$PR_NUMBER.preview.shell.migos.club/"
          current="$(
            curl --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 \
              --dump-header - --output /dev/null "https://shell.preview.migos.club/" |
              awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /,""); sub(/\r$/,""); print; exit}'
          )"

          if [[ "$current" != "$closing_url" ]]; then
            echo "safe_to_delete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fallback=""
          while read -r number; do
            [[ -z "$number" || "$number" == "$PR_NUMBER" ]] && continue
            candidate="https://pr-$number.preview.shell.migos.club"
            if curl --fail --show-error --silent --max-time 15 --output /dev/null "$candidate/"; then
              fallback="$candidate"
              break
            fi
          done < <(gh pr list --state open --limit 30 --json number,updatedAt --jq 'sort_by(.updatedAt) | reverse | .[].number')

          if [[ -z "$fallback" ]]; then
            echo "::warning::No healthy open PR preview found. Keeping pr-$PR_NUMBER alive so shell.preview.migos.club does not break."
            echo "safe_to_delete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          worker="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$worker" "$response"' EXIT
          CUSTOM_PREVIEW_URL="$fallback" node >"$worker" <<'NODE'
          const target = process.env.CUSTOM_PREVIEW_URL;
          process.stdout.write(`addEventListener("fetch", event => {
            const incoming = new URL(event.request.url);
            const target = new URL(${JSON.stringify(target)});
            target.pathname = incoming.pathname;
            target.search = incoming.search;
            event.respondWith(new Response(null, {
              status: 302,
              headers: {
                "Location": target.toString(),
                "Cache-Control": "no-store",
                "X-Robots-Tag": "noindex"
              }
            }));
          });`);
          NODE
          curl --fail-with-body --show-error --silent \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/javascript" \
            --data-binary "@$worker" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shell-preview-latest" \
            --output "$response"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!data.success) {
            console.error(data.errors ?? data);
            process.exit(1);
          }
          NODE
          echo "safe_to_delete=true" >> "$GITHUB_OUTPUT"
          echo "Latest-preview redirect moved to $fallback" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete closed PR preview
        if: steps.redirect_guard.outputs.safe_to_delete == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --yes wrangler@^4.135.0 preview delete --name "pr-$PR_NUMBER" --skip-confirmation
