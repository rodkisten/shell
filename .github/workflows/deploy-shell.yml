name: 🐚 SH · Deploy ShellConductor
run-name: "🚀 Shell deploy · ${{ github.ref_name }} · ${{ github.event_name }}"
on:
  push:
    branches: [main]
    paths:
      - "tools/shell-flow/**"
      - "scripts/build-shell-flow-wasm.sh"
      - "scripts/test-shell-flow-wasm.mjs"
      - ".github/workflows/shell-flow-wasm.yml"
      - "apps/workflow/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-workflow.mjs"
      - "scripts/*modules.mjs"
      - "scripts/verify-module.mjs"
      - "vendor/**"
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-shell.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shell-production
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/shell-flow-wasm.yml
    permissions:
      contents: read
      actions: read
  deploy:
    needs: build
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/src/setup-node@main
        with:
          node-version: "24"
          install: "false"
          cache: "false"
      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: shell-flow-preview-dist
          path: .
      - name: Verify restored deploy configuration
        run: |
          test -s dist/client/wasm/shell-flow.wasm
          test -s .wrangler/deploy/config.json
      - name: Deploy Worker and R2 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN in production environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID in production environment}"
          npx --yes wrangler@^4.135.0 deploy
      - name: Verify immutable Code production artifacts
        env:
          MODULE_ORIGIN: https://shell.migos.club
          MODULE_SHA: ${{ github.sha }}
        run: node scripts/verify-module.mjs
      - name: Verify Linux v86 production assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://shell.migos.club/v86"
          assets=(libv86.js v86.wasm seabios.bin vgabios.bin alpine.iso)
          types=("text/javascript" "application/wasm" "application/octet-stream" "application/octet-stream" "application/octet-stream")
          {
            echo "## 🐧 Linux v86 production smoke test"
            echo "| Asset | HEAD | Range | Size |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for i in "${!assets[@]}"; do
            name="${assets[$i]}"
            url="$base/$name"
            headers="$(mktemp)"
            ranged="$(mktemp)"
            trap 'rm -f "$headers" "$ranged"' EXIT
            for attempt in 1 2 3 4 5; do
              status="$(curl -sSL -o /dev/null -D "$headers" -w '%{http_code}' -I --max-time 20 "$url" || true)"
              if [[ "$status" == 200 ]]; then break; fi
              echo "::warning title=Linux asset retry::$name returned $status (attempt $attempt)"
              sleep 5
            done
            if [[ "$status" != 200 ]]; then
              echo "::error title=Linux asset unavailable::$name HEAD returned $status"
              exit 1
            fi
            grep -qi "^content-type: ${types[$i]}" "$headers" || { echo "::error title=Unexpected MIME::$name"; exit 1; }
            size="$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="content-length:" {gsub("\\r","",$2);print $2}' "$headers" | tail -1)"
            [[ "$size" =~ ^[0-9]+$ ]] && (( size > 0 )) || { echo "::error title=Invalid asset size::$name"; exit 1; }
            code="$(curl -sSL -o /dev/null -D "$ranged" -w '%{http_code}' -H 'Range: bytes=0-1023' --max-time 20 "$url")"
            [[ "$code" == 206 ]] || { echo "::error title=Range unsupported::$name returned $code"; exit 1; }
            expected_end=1023
            if (( size < 1024 )); then expected_end=$((size - 1)); fi
            grep -qi "^content-range: bytes 0-${expected_end}/${size}" "$ranged" || { echo "::error title=Invalid Content-Range::$name"; exit 1; }
            echo "| \`$name\` | 200 | 206 | $size bytes |" >> "$GITHUB_STEP_SUMMARY"
            echo "Verified $name ($size bytes)"
            rm -f "$headers" "$ranged"
            trap - EXIT
          done
