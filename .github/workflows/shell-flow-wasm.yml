name: 🧠 Shell Flow WASM

on:
  pull_request:
    paths:
      - 'tools/shell-flow/**'
      - 'scripts/build-shell-flow-wasm.sh'
      - 'scripts/test-shell-flow-wasm.mjs'
      - 'src/lib/shell-flow-wasm.ts'
      - 'src/App.tsx'
      - 'src/components/ExecutionExplorer.tsx'
      - 'public/wasm/flow-worker.js'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/shell-flow-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: Compile and smoke-test Go WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/shell-flow/go.mod
          cache: false
      - name: Download Go dependencies
        working-directory: tools/shell-flow
        run: go mod tidy && go mod download
      - name: Verify Go module
        working-directory: tools/shell-flow
        run: go mod verify
      - name: Build WASM
        run: bash scripts/build-shell-flow-wasm.sh
      - name: Check WASM magic header
        run: |
          test -s public/wasm/shell-flow.wasm
          test -s public/wasm/wasm_exec.js
          python3 - <<'PY'
          from pathlib import Path
          assert Path('public/wasm/shell-flow.wasm').read_bytes()[:4] == bytes([0, 97, 115, 109])
          print('WASM header valid')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute WASM smoke tests
        run: node scripts/test-shell-flow-wasm.mjs
      - name: Install frontend dependencies
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            echo '::error::package-lock.json missing. Run the 🔒 Sync npm lockfile workflow on this branch first.'
            exit 1
          fi
      - name: Typecheck and bundle app with previously compiled WASM
        run: npm run ast:inspect && npm run typecheck && npx vite build
      - name: Verify deployable WASM assets
        run: |
          test -s dist/wasm/shell-flow.wasm
          test -s dist/wasm/wasm_exec.js
          test -s dist/wasm/flow-worker.js
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const b=readFileSync('dist/wasm/shell-flow.wasm'); if (b.subarray(0,4).toString('hex')!=='0061736d') process.exit(1)"
      - name: Upload deployable frontend
        uses: actions/upload-artifact@v4
        with:
          name: shell-flow-preview-dist
          path: dist/
          retention-days: 7
      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-flow-wasm
          path: public/wasm/
          retention-days: 7
