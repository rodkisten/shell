name: 🐚 SH · 🧠 Shell Flow WASM

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wasm:
    name: Compile and smoke-test Go WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/shell-flow/go.mod
          cache: false
      - name: Verify Go module
        working-directory: tools/shell-flow
        run: go mod verify
      - name: Setup Rodlog
        uses: rodkisten/github/src/setup-rodlog@main
      - name: Build WASM
        uses: rodkisten/github/src/console-run@main
        with:
          title: Compile Go WASM
          command: bash scripts/build-shell-flow-wasm.sh
      - name: Check WASM magic header
        run: |
          test -s public/wasm/shell-flow.wasm
          test -s public/wasm/wasm_exec.js
          python3 - <<'PY'
          from pathlib import Path
          assert Path('public/wasm/shell-flow.wasm').read_bytes()[:4] == bytes([0, 97, 115, 109])
          print('WASM header valid')
          PY
      - uses: rodkisten/github/src/setup-node@main
        with:
          node-version: '24'
          install: 'false'
          cache: 'true'
      - name: Execute WASM smoke tests
        run: node scripts/test-shell-flow-wasm.mjs
      - uses: pnpm/action-setup@v4
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate AST, validate TypeScript and lint, then bundle
        uses: rodkisten/github/src/console-run@main
        with:
          title: AST, TypeScript, lint and frontend build
          command: npm run ast:inspect && npm run typecheck && npm run lint && npx vite build
      - name: Stage standalone and immutable federated Code in the same preview
        env:
          MODULE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MODULE_ORIGIN: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.preview.shell.migos.club', github.event.pull_request.number) || 'https://shell.migos.club' }}
        run: npm run build:workflow
      - name: Retain two compatible prior releases in this deployment lane
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/retain-modules.mjs
      - name: Preserve immutable Code artifact for rollback
        uses: actions/upload-artifact@v4
        with:
          name: code-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || 'main' }}-module-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/client/modules/
          retention-days: 30
      - name: Verify deployable WASM assets
        run: |
          # Cloudflare Vite plugin emits static files under dist/client.
          asset_root="dist/client/wasm"
          for asset in shell-flow.wasm wasm_exec.js flow-worker.js; do
            test -s "$asset_root/$asset" || { echo "::error::Missing $asset_root/$asset"; find dist -maxdepth 4 -type f -name "$asset" -print; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dist/client/wasm/shell-flow.wasm')
          assert path.read_bytes()[:4] == bytes([0, 97, 115, 109]), f'Invalid WASM header: {path}'
          print('Deployable WASM header valid')
          PY
      - name: Upload deployable frontend
        uses: actions/upload-artifact@v4
        with:
          name: shell-flow-preview-dist
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          retention-days: 7
      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-flow-wasm
          path: public/wasm/
          retention-days: 7
